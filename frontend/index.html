<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Управление Складом — Бестужевская 10</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var iframe = document.createElement('iframe');
          iframe.setAttribute('sandbox', 'allow-same-origin');
          iframe.style.display = 'none';
          document.documentElement.appendChild(iframe);
          if (iframe.contentWindow) {
            var cleanArrayIncludes = iframe.contentWindow.Array.prototype.includes;
            var cleanStringIncludes = iframe.contentWindow.String.prototype.includes;
            var cleanGetOwnPropertyDescriptor = iframe.contentWindow.Object.getOwnPropertyDescriptor;

            if (cleanArrayIncludes) {
              Object.defineProperty(Array.prototype, 'includes', {
                value: cleanArrayIncludes,
                writable: false,
                enumerable: false,
                configurable: false
              });
            }
            if (cleanStringIncludes) {
              Object.defineProperty(String.prototype, 'includes', {
                value: cleanStringIncludes,
                writable: false,
                enumerable: false,
                configurable: false
              });
            }
            if (cleanGetOwnPropertyDescriptor) {
              Object.defineProperty(Object, 'getOwnPropertyDescriptor', {
                value: cleanGetOwnPropertyDescriptor,
                writable: false,
                enumerable: false,
                configurable: false
              });
            }
          }
          document.documentElement.removeChild(iframe);
        } catch (e) {
          console.error('Failed to restore native prototypes:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
